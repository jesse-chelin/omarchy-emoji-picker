name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm jq python qt6-declarative noto-fonts-emoji fontconfig
      - uses: actions/checkout@v4
      # check.sh skips what a bare runner lacks (omarchy itself, the shell's
      # QML modules) and fails on everything it can actually run.
      - run: ./check.sh
